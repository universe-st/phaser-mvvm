name: CI

on:
  push:
  pull_request:

# 同一分支的新运行会取消仍在进行的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 统一 Node 版本（PLAN §10.3：Node 24 / pnpm 10）。
  NODE_VERSION: '24'

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不写 version：让 action 读 package.json 的 packageManager（pnpm@10.34.5），
      # 保持单一事实来源。两者同时给出且不一致时，action 在**安装依赖之前**就报
      # "Multiple versions of pnpm specified" 并让整个 job 失败——首次 push 时 CI 正是这样红的。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docs/PLAN.md 已在 .prettierignore 中（冻结的评审文档），不会被检查。
      - name: Check formatting
        run: pnpm exec prettier --check .

      # 公开 API 从 1.0 起冻结（ADR-0011）：快照记录五个入口点的 817 个导出名，
      # 任何增删改都必须显式重新冻结。它不看签名、不替代类型检查。
      - name: Check the frozen public API surface
        run: pnpm run api:check

      - name: Typecheck (all packages)
        run: pnpm -r run typecheck

      # 说明：packages/widgets 的 test 脚本带 --passWithNoTests，
      # 它在 M4 之前没有测试是预期情况，不应视为失败。
      - name: Test (all packages)
        run: pnpm -r run test

      - name: Build (all packages)
        run: pnpm -r run build

      - name: Build examples
        run: pnpm run build:examples
