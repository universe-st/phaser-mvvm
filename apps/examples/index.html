<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>phaser-mvvm examples</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* deliberately different from the Phaser clear colour (#0d1117) so a blank
           canvas is distinguishable from a rendered one in headless screenshots. */
        background: #05070a;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      #game canvas {
        display: block;
      }
      /* Machine-readable readouts for the interactive checks (`scripts/visual-check.mjs`, the
         acceptance runs). They are deliberately *not painted*: the automated checks read
         `textContent`, and a reviewer looking at the canvas should not see a wall of grey
         monospace text on top of the UI. `display: none` keeps the text in the DOM. */
      #demo-state,
      #status {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <pre id="status"></pre>
    <pre id="demo-state"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
