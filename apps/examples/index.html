<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>phaser-mvvm examples</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      #game canvas {
        display: block;
      }
      #status {
        position: fixed;
        left: 10px;
        bottom: 10px;
        z-index: 10;
        margin: 0;
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #6e7681;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <pre id="status"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
